<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Logicondo C/93</title>
    

  </head>
    
  <body>
  <div id="toast" style="position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#25D366;color:#fff;padding:12px 20px;border-radius:10px;font-weight:900;z-index:99999;display:none"></div>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#0a0a0a;color:#fff;min-height:100vh}
.top{background:#111;border-bottom:2px solid #FFD700;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
.logo{font-weight:900;color:#FFD700;font-size:18px;cursor:pointer}
.badge{background:#FFD700;color:#000;font-weight:900;padding:5px 12px;border-radius:20px;font-size:12px}
.screen{padding:14px;max-width:600px;margin:0 auto}
.card{background:#1e1e1e;border:1px solid #2a2a2a;border-radius:14px;padding:14px;margin-bottom:12px}
input,select{width:100%;background:#0f0f0f;border:1px solid #333;color:#fff;padding:14px;border-radius:10px;margin-bottom:8px;font-size:15px;outline:none}
input:focus{border-color:#FFD700}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;background:#FFD700;color:#000;border:none;padding:14px;border-radius:10px;font-weight:900;font-size:15px;cursor:pointer}
.btn2{background:#222;color:#fff;border:1px solid #444}
.foto-prev{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-bottom:8px;display:none;border:1px solid #333}
.item{background:#151515;border:1px solid #222;padding:12px;border-radius:10px;margin-bottom:8px}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.tab{background:#1a1a1a;color:#888;padding:10px;border-radius:10px;border:1px solid #333;font-size:11px;font-weight:700}
.tab.on{background:#FFD700;color:#000;border-color:#FFD700}
.sugestoes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.sug{font-size:11px;background:#222;border:1px solid #333;padding:6px 10px;border-radius:20px;color:#aaa}
</style>

<!-- TOPO -->
<div class="top"><div class="logo" onclick="cliquesLogo()" id="logoTxt">LOGICONDO</div><div style="display:flex;gap:6px;align-items:center"><div class="badge" id="badgeCondo">C93</div><button onclick="sair()" style="background:#222;color:#fff;border:1px solid #444;padding:6px 12px;border-radius:20px;font-size:11px">SAIR</button></div></div>

<!-- LOGIN PORTEIRO -->
<div id="tela-login" class="screen">
  <div class="card" style="margin-top:40px">
    <h2 style="color:#FFD700;margin-bottom:6px">Acesso Porteiro</h2>
    <p style="color:#888;font-size:12px;margin-bottom:12px">Condomínio: <b id="loginCondoTxt" style="color:#FFD700">C93</b></p>
    <input id="nomePorteiro" placeholder="Seu nome de plantão - Ex: Rafael">
    <button class="btn" onclick="entrar()">ENTRAR EM SERVIÇO</button>
  </div>
  <p style="text-align:center;color:#333;font-size:10px;margin-top:20px">Toque 5x no LOGICONDO para admin</p>
</div>

<!-- APP PORTEIRO -->
<div id="tela-app" class="screen" style="display:none">
  <div class="tabs">
    <button id="tb-entrada" class="tab on" onclick="aba('entrada')">📦<br>ENTRADA</button>
    <button id="tb-moradores" class="tab" onclick="aba('moradores')">👥<br>MORADOR</button>
    <button id="tb-lista" class="tab" onclick="aba('lista')">📋<br>LISTA</button>
    <button id="tb-hist" class="tab" onclick="aba('hist')">🕘<br>HISTÓRICO</button>
  </div>

  <!-- ABA ENTRADA -->
  <div id="aba-entrada">
    <div class="card">
      <h3 style="color:#FFD700;font-size:13px;margin-bottom:10px">REGISTRAR ENCOMENDA</h3>
      <div class="row"><input id="e-bloco" placeholder="BLOCO - A" oninput="filtraMorador()"><input id="e-apto" placeholder="APTO - 102" oninput="filtraMorador()"></div>
      <select id="e-morador"><option value="">Digite bloco e apto primeiro</option></select>
      <div class="sugestoes"><span class="sug" onclick="setDesc('Mercado Livre')">Mercado Livre</span><span class="sug" onclick="setDesc('Shopee')">Shopee</span><span class="sug" onclick="setDesc('Shein')">Shein</span><span class="sug" onclick="setDesc('Amazon')">Amazon</span><span class="sug" onclick="setDesc('iFood')">iFood</span></div>
      <input id="e-desc" placeholder="Descrição - Ex: Caixa Mercado Livre">
      <input type="file" id="e-foto" accept="image/*" capture="environment" onchange="compFoto(this,'prevE')">
      <img id="prevE" class="foto-prev">
      <button class="btn" onclick="registrarEnc()">✅ REGISTRAR + AVISAR MORADOR</button>
    </div>
  </div>

  <!-- ABA MORADOR -->
  <div id="aba-moradores" style="display:none">
    <div class="card">
      <h3 style="color:#FFD700;font-size:13px;margin-bottom:10px">CADASTRAR MORADOR</h3>
      <div class="row"><input id="m-bloco" placeholder="BLOCO"><input id="m-apto" placeholder="APTO"></div>
      <input id="m-nome" placeholder="Nome completo">
      <input id="m-doc" placeholder="Documento (opcional)">
      <input id="m-wpp" placeholder="WhatsApp - 11 9XXXX-XXXX">
      <input type="file" id="m-foto" accept="image/*" capture="user" onchange="compFoto(this,'prevM')">
      <img id="prevM" class="foto-prev">
      <button class="btn" onclick="salvarMorador()">SALVAR MORADOR</button>
    </div>
    <div id="listaMoradoresCad"></div>
  </div>

  <!-- ABA LISTA (ENCOMENDAS NA PORTARIA) -->
  <div id="aba-lista" style="display:none"><div id="listaPendentes"></div></div>

  <!-- ABA HISTORICO -->
  <div id="aba-hist" style="display:none">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px">
      <button class="btn btn2" onclick="verHist('moradores')">Hist. Moradores</button>
      <button class="btn btn2" onclick="verHist('encomendas')">Hist. Encomendas</button>
    </div>
    <div id="listaHist"></div>
  </div>
</div>

<!-- TELA ADMIN (SÓ VOCÊ VÊ) -->
<div id="tela-admin" class="screen" style="display:none">
  <div class="card" style="border-color:#FFD700">
    <h2 style="color:#FFD700">ADMIN - Controle de Links</h2>
    <p style="color:#888;font-size:12px;margin:8px 0">Só você vê essa tela. Porteiro não vê.</p>
    <input id="admin-novo-id" placeholder="ID do condomínio - Ex: C93">
    <input id="admin-novo-nome" placeholder="Nome - Ex: Residencial Flores">
    <button class="btn" onclick="criarCondo()">CRIAR / LIBERAR LINK</button>
    <div id="listaAdmin" style="margin-top:12px"></div>
    <button class="btn btn2" style="margin-top:12px" onclick="voltarPorteiro()">VOLTAR PARA PORTARIA</button>
  </div>
</div>

<script>
var CONDO_ID='C93';
try{var p=new URLSearchParams(location.search);var c=p.get('condo');if(c)CONDO_ID=c.toUpperCase().trim();}catch(e){}
document.getElementById('badgeCondo').innerText=CONDO_ID;
document.getElementById('loginCondoTxt').innerText=CONDO_ID;

var cliques=0;
function cliquesLogo(){cliques++; if(cliques>=5){document.getElementById('tela-login').style.display='none';document.getElementById('tela-app').style.display='none';document.getElementById('tela-admin').style.display='block';renderAdmin();cliques=0;} setTimeout(function(){cliques=0},3000);}

function toast(m){var e=document.getElementById('toast');e.innerText=m;e.style.display='block';setTimeout(function(){e.style.display='none'},3000);}
function compFoto(inp,id){if(!inp.files||!inp.files[0])return;var r=new FileReader();r.onload=function(ev){var im=new Image();im.onload=function(){var ca=document.createElement('canvas');var max=600,w=im.width,h=im.height;if(w>h){if(w>max){h*=max/w;w=max}}else{if(h>max){w*=max/h;h=max}}ca.width=w;ca.height=h;ca.getContext('2d').drawImage(im,0,0,w,h);var co=ca.toDataURL('image/jpeg',0.6);var pr=document.getElementById(id);pr.src=co;pr.style.display='block';pr.dataset.base=co;};im.src=ev.target.result;};r.readAsDataURL(inp.files[0]);}
function setDesc(t){document.getElementById('e-desc').value=t;}

function kM(){return 'logi_mor_'+CONDO_ID} function kE(){return 'logi_enc_'+CONDO_ID} function kH(){return 'logi_hist_'+CONDO_ID}
function entrar(){var n=document.getElementById('nomePorteiro').value.trim();if(!n){alert('Digite seu nome');return}localStorage.setItem('logi_sess_'+CONDO_ID,n);document.getElementById('tela-login').style.display='none';document.getElementById('tela-app').style.display='block';carregar();}
function sair(){localStorage.removeItem('logi_sess_'+CONDO_ID);document.getElementById('tela-app').style.display='none';document.getElementById('tela-login').style.display='block';document.getElementById('nomePorteiro').value='';}

function aba(t){
  document.getElementById('aba-entrada').style.display=(t==='entrada'?'block':'none');
  document.getElementById('aba-moradores').style.display=(t==='moradores'?'block':'none');
  document.getElementById('aba-lista').style.display=(t==='lista'?'block':'none');
  document.getElementById('aba-hist').style.display=(t==='hist'?'block':'none');
  document.querySelectorAll('.tab').forEach(function(e){e.classList.remove('on')});
  if(t==='entrada')document.getElementById('tb-entrada').classList.add('on');
  if(t==='moradores'){document.getElementById('tb-moradores').classList.add('on');renderMoradoresCad();}
  if(t==='lista'){document.getElementById('tb-lista').classList.add('on');renderPendentes();}
  if(t==='hist'){document.getElementById('tb-hist').classList.add('on');verHist('encomendas');}
}

function filtraMorador(){
  var b=document.getElementById('e-bloco').value.toUpperCase().trim();
  var a=document.getElementById('e-apto').value.toUpperCase().trim();
  var lista=JSON.parse(localStorage.getItem(kM())||'[]');
  var sel=document.getElementById('e-morador');
  sel.innerHTML='<option value="">Selecione o morador</option>';
  lista.filter(function(m){var okB=!b||(m.bloco||'').toUpperCase().indexOf(b)>-1; var okA=!a||m.apto.indexOf(a)>-1; return okB&&okA;}).forEach(function(m){
    var o=document.createElement('option');o.value=m.nome+'|'+m.wpp+'|'+m.apto+'|'+(m.bloco||'')+'|'+(m.doc||'');o.innerText='Bl '+(m.bloco||'-')+' Ap '+m.apto+' - '+m.nome;sel.appendChild(o);
  });
}

function salvarMorador(){
  var bl=document.getElementById('m-bloco').value.trim().toUpperCase();
  var ap=document.getElementById('m-apto').value.trim();
  var no=document.getElementById('m-nome').value.trim();
  var doc=document.getElementById('m-doc').value.trim();
  var wpp=document.getElementById('m-wpp').value.trim();
  var foto=document.getElementById('prevM').dataset.base||'';
  if(!bl||!ap||!no){alert('Preencha BLOCO, APTO e NOME');return}
  var l=JSON.parse(localStorage.getItem(kM())||'[]');
  l.push({id:Date.now(),bloco:bl,apto:ap,nome:no,doc:doc,wpp:wpp,foto:foto,data:new Date().toLocaleString('pt-BR')});
  localStorage.setItem(kM(),JSON.stringify(l));
  document.getElementById('m-bloco').value='';document.getElementById('m-apto').value='';document.getElementById('m-nome').value='';document.getElementById('m-doc').value='';document.getElementById('m-wpp').value='';document.getElementById('m-foto').value='';var im=document.getElementById('prevM');im.src='';im.style.display='none';im.dataset.base='';
  toast('✅ MORADOR CADASTRADO!');
  renderMoradoresCad(); filtraMorador();
}
function renderMoradoresCad(){var l=JSON.parse(localStorage.getItem(kM())||'[]');document.getElementById('listaMoradoresCad').innerHTML=l.map(function(m){return '<div class="item"><b>Bl '+(m.bloco||'-')+' - '+m.apto+'</b> - '+m.nome+'<br><small style="color:#25D366">'+m.wpp+'</small> '+(m.doc?'<small>Doc:'+m.doc+'</small>':'')+'</div>'}).join('')||'<p style="color:#555;text-align:center">Nenhum morador cadastrado</p>';}

function registrarEnc(){
  var bl=document.getElementById('e-bloco').value.trim().toUpperCase();
  var ap=document.getElementById('e-apto').value.trim();
  var sel=document.getElementById('e-morador').value;
  var desc=document.getElementById('e-desc').value.trim();
  var foto=document.getElementById('prevE').dataset.base||'';
  if(!ap||!sel){alert('Selecione bloco/apto e morador');return}
  var pa=sel.split('|');var nome=pa[0],wpp=pa[1],blM=pa[3]||bl;
  var porteiro=localStorage.getItem('logi_sess_'+CONDO_ID)||'Portaria';
  var hora=new Date().toLocaleString('pt-BR');
  var item={id:Date.now(),bloco:blM,apto:ap,morador:nome,wpp:wpp,desc:desc,foto:foto,porteiro:porteiro,chegada:hora,status:'NA PORTARIA'};
  var lista=JSON.parse(localStorage.getItem(kE())||'[]');lista.unshift(item);localStorage.setItem(kE(),JSON.stringify(lista));
  if(wpp){var num=wpp.replace(/\D/g,'');var msg='📦 *LOGICONDO '+CONDO_ID+'*%0A%0AOlá '+nome+'!%0A%0ASua encomenda chegou:%0A📍 Bl '+blM+' Ap '+ap+'%0A📦 '+desc+'%0A👮 Recebido por: '+porteiro+'%0A🕐 Horário: '+hora+'%0A%0ARetire na portaria.';window.open('https://wa.me/55'+num+'?text='+msg,'_blank');}
  document.getElementById('e-bloco').value='';document.getElementById('e-apto').value='';document.getElementById('e-morador').innerHTML='<option value="">Selecione bloco e apto primeiro</option>';document.getElementById('e-desc').value='';document.getElementById('e-foto').value='';var im=document.getElementById('prevE');im.src='';im.style.display='none';im.dataset.base='';
  toast('✅ ENCOMENDA REGISTRADA!');
  renderPendentes();
}

function renderPendentes(){
  var lista=JSON.parse(localStorage.getItem(kE())||'[]').filter(function(e){return e.status==='NA PORTARIA'});
  document.getElementById('listaPendentes').innerHTML=lista.map(function(e){return '<div class="item"><b>Bl '+(e.bloco||'-')+' - '+e.apto+'</b> - '+e.morador+'<br><small>'+e.desc+' - '+e.chegada+' por '+e.porteiro+'</small><br><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px"><input id="quem-'+e.id+'" placeholder="Quem retirou?"><button class="btn" style="padding:8px" onclick="entregar('+e.id+')">ENTREGAR</button></div></div>'}).join('')||'<p style="color:#555;text-align:center;margin-top:20px">Nenhuma encomenda pendente</p>';
}
function entregar(id){
  var quem=document.getElementById('quem-'+id).value.trim();if(!quem){alert('Digite quem retirou');return}
  var lista=JSON.parse(localStorage.getItem(kE())||'[]');var idx=lista.findIndex(function(e){return e.id===id});if(idx==-1)return;
  var e=lista[idx];var porteiro=localStorage.getItem('logi_sess_'+CONDO_ID)||'Portaria';var hora=new Date().toLocaleString('pt-BR');
  e.status='ENTREGUE';e.quemRetirou=quem;e.entreguePor=porteiro;e.horaEntrega=hora;
  localStorage.setItem(kE(),JSON.stringify(lista));
  var hist=JSON.parse(localStorage.getItem(kH())||'[]');hist.unshift(e);localStorage.setItem(kH(),JSON.stringify(hist));
  if(e.wpp){var num=e.wpp.replace(/\D/g,'');var msg='✅ *LOGICONDO '+CONDO_ID+' - ENTREGA CONFIRMADA*%0A%0AEncomenda: '+e.desc+'%0A👤 Retirado por: '+quem+'%0A👮 Entregue por: '+porteiro+'%0A🕐 Horário: '+hora+'%0A📍 Bl '+(e.bloco||'-')+' Ap '+e.apto;window.open('https://wa.me/55'+num+'?text='+msg,'_blank');}
  toast('✅ Entregue para '+quem);
  renderPendentes();
}

function verHist(tipo){
  if(tipo==='moradores'){var l=JSON.parse(localStorage.getItem(kM())||'[]');document.getElementById('listaHist').innerHTML='<h3 style="color:#FFD700;margin-bottom:8px">Histórico Moradores - '+l.length+'</h3>'+l.map(function(m){return '<div class="item"><b>Bl '+(m.bloco||'-')+' - '+m.apto+'</b> - '+m.nome+'<br><small>'+m.data+'</small></div>'}).join('');}
  else{var h=JSON.parse(localStorage.getItem(kH())||'[]');document.getElementById('listaHist').innerHTML='<h3 style="color:#FFD700;margin-bottom:8px">Histórico Entregas - '+h.length+'</h3>'+h.map(function(e){return '<div class="item"><b>Bl '+(e.bloco||'-')+' - '+e.apto+'</b> - '+e.morador+'<br><small>'+e.desc+' | Entregue: '+e.quemRetirou+' por '+e.entreguePor+' em '+e.horaEntrega+'</small></div>'}).join('')||'<p style="color:#555;text-align:center">Nenhum histórico</p>';}
}

function carregar(){filtraMorador();renderMoradoresCad();renderPendentes();}

// ADMIN
function criarCondo(){var id=document.getElementById('admin-novo-id').value.trim().toUpperCase();var nome=document.getElementById('admin-novo-nome').value.trim();if(!id){alert('Digite ID');return}var lista=JSON.parse(localStorage.getItem('admin_condos')||'[]');if(lista.find(function(x){return x.id===id})){alert('Já existe');return}lista.push({id:id,nome:nome||id,status:'ATIVO',criado:new Date().toLocaleString('pt-BR')});localStorage.setItem('admin_condos',JSON.stringify(lista));document.getElementById('admin-novo-id').value='';document.getElementById('admin-novo-nome').value='';renderAdmin();}
function renderAdmin(){var lista=JSON.parse(localStorage.getItem('admin_condos')||'[]');document.getElementById('listaAdmin').innerHTML=lista.map(function(c){return '<div class="item"><b>'+c.id+'</b> - '+c.nome+'<br><small>'+c.criado+' - '+c.status+'</small><br><div style="margin-top:6px;font-size:11px;word-break:break-all;background:#000;padding:6px;border-radius:6px;color:#FFD700">https://cdpn.io/xcukjlgv-the-sasster/debug/ZYeKBKB?condo='+c.id+'</div><div style="display:flex;gap:6px;margin-top:6px"><button class="btn" style="padding:6px;font-size:11px" onclick="toggleCondo(\''+c.id+'\')">'+(c.status==='ATIVO'?'BLOQUEAR':'LIBERAR')+'</button><button class="btn btn2" style="padding:6px;font-size:11px" onclick="delCondo(\''+c.id+'\')">Excluir</button></div></div>'}).join('')||'<p style="color:#555">Nenhum condomínio</p>';}
function toggleCondo(id){var lista=JSON.parse(localStorage.getItem('admin_condos')||'[]');var i=lista.findIndex(function(x){return x.id===id});if(i>-1){lista[i].status=lista[i].status==='ATIVO'?'BLOQUEADO':'ATIVO';localStorage.setItem('admin_condos',JSON.stringify(lista));renderAdmin();}}
function delCondo(id){if(!confirm('Excluir '+id+'?'))return;var lista=JSON.parse(localStorage.getItem('admin_condos')||'[]').filter(function(x){return x.id!==id});localStorage.setItem('admin_condos',JSON.stringify(lista));renderAdmin();}
function voltarPorteiro(){document.getElementById('tela-admin').style.display='none';document.getElementById('tela-login').style.display='block';}
</script>
    <script  src="./script.js"></script>

  </body>
  
</html>
